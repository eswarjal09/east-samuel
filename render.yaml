services:
  - type: web
    name: macrofactor-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: macrofactor-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: macrofactor-db
    databaseName: macrofactor
    user: macrofactor
